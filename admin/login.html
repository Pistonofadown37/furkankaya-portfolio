<!DOCTYPE html>

<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Yönetim Paneli Giriş | Furkan Kaya
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body class="admin-page">


    <!-- =====================================
         LOGIN PAGE
    ====================================== -->

    <main class="login-page">


        <div class="login-container">


            <!-- LOGO -->

            <a
                href="../index.html"
                class="admin-logo login-logo"
            >
                FURKAN<span>KAYA</span>
            </a>


            <!-- LOGIN CARD -->

            <section class="login-card">


                <div class="login-header">

                    <span class="login-eyebrow">
                        YÖNETİM PANELİ
                    </span>


                    <h1>
                        Hoş Geldin
                    </h1>


                    <p>
                        Yönetim paneline erişmek için
                        giriş yap.
                    </p>

                </div>


                <!-- FORM -->

                <form
                    id="loginForm"
                    novalidate
                >


                    <!-- EMAIL -->

                    <div class="admin-form-group">

                        <label
                            for="loginEmail"
                        >
                            E-posta Adresi
                        </label>


                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="ornek@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="admin-form-group">

                        <label
                            for="loginPassword"
                        >
                            Şifre
                        </label>


                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Şifrenizi girin"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="admin-primary-button login-submit-button"
                    >
                        Giriş Yap
                    </button>


                </form>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="admin-message"
                ></div>


            </section>


        </div>


    </main>


    <!-- =====================================
         SUPABASE LIBRARY
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================
         SUPABASE CONNECTION
    ====================================== -->

    <script
        src="supabase.js"
    ></script>


    <!-- =====================================
         LOGIN JAVASCRIPT
    ====================================== -->

    <script
        src="login.js"
    ></script>


</body>

</html>
